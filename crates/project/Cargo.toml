[package]
name = "cdt-project"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The .cdt project file: a zip holding the serialized document (plus optional extras like viewport state). No GPU, no kernel."

[dependencies]
cdt-core = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
