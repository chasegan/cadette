[package]
name = "cdt-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wgpu viewport: scene buffers, camera, picking, gizmos, overlays."

[dependencies]
cdt-core = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
anyhow = { workspace = true }
wgpu = "29"
winit = { version = "0.30", optional = true }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true, optional = true }
egui-phosphor = "0.12.0"

[features]
default = ["window"]
# The interactive winit window (`run`). Off, the crate is the offscreen
# renderer + picking only — no windowing stack linked (for headless tools).
window = ["dep:winit", "dep:egui-winit"]
