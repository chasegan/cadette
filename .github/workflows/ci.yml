name: CI

# Test on every push and PR. macOS gets the full suite (the render crate's
# tests create a real wgpu device, which the runner's Metal backend provides).
# Windows downloads OCCT's official release binaries and skips the render
# crate until WARP (software DX12) support there is verified.
on:
  push:
    paths-ignore: ['docs/**', 'md/**', 'branding/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', 'md/**', 'branding/**', '*.md']

# A newer push to the same branch supersedes any run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install OpenCASCADE (Homebrew)
        if: runner.os == 'macOS'
        # The runner image pre-taps aws/tap, which trips Homebrew's tap-trust
        # check and prints a warning on every brew command. We don't use it.
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install opencascade

      - name: Install OpenCASCADE (official Windows package)
        if: runner.os == 'Windows'
        # vcpkg builds OCCT from source, close to two hours cold; OCCT's own
        # release binaries download in seconds. Pinned to the version vcpkg's
        # port currently ships, so this tests what Windows builders get.
        # build.rs recognises the package layout (inc/, win64/vc14/{lib,bin}).
        env:
          OCCT_VERSION: 8.0.1
        # The release assets are zips wrapping zips; 7-Zip (on the runner)
        # unpacks the inner one in place. TKernel.dll in the official build
        # imports jemalloc and TBB, which live in the separate 3rdparty
        # package: just those two DLLs are pulled out of it, next to OCCT's.
        run: |
          $base = "https://github.com/Open-Cascade-SAS/OCCT/releases/download/V$env:OCCT_VERSION"
          Invoke-WebRequest -Uri "$base/opencascade-release-no-pch.zip" -OutFile occt.zip
          Invoke-WebRequest -Uri "$base/3rdparty-vc14-64.zip" -OutFile 3rdparty.zip
          7z x -y occt.zip -ooutter | Out-Null
          7z x -y "outter\opencascade-$env:OCCT_VERSION-vc14-64.zip" -oocct | Out-Null
          7z x -y 3rdparty.zip -ooutter | Out-Null
          $prefix = "$PWD\occt\opencascade-$env:OCCT_VERSION-vc14-64"
          $bin = "$prefix\win64\vc14\bin"
          7z e -y "outter\3rdparty-vc14-64.zip" "-o$bin" "3rdparty-vc14-64\tbb-2021.13.0-x64\bin\tbb12.dll" "3rdparty-vc14-64\jemalloc-vc14-64\bin\jemalloc.dll" | Out-Null
          Get-ChildItem $bin -Filter "*.dll" | Where-Object { $_.Name -notlike "TK*" }
          Add-Content $env:GITHUB_ENV "CDT_OCCT_PREFIX=$prefix"
          # Test executables load the OCCT DLLs from PATH at runtime.
          Add-Content $env:GITHUB_PATH $bin

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        # A hung test must not hold a runner for GitHub's six-hour default.
        # (On the step, not the job: a cold vcpkg OCCT build alone is ~2 h.)
        timeout-minutes: 30
        run: |
          export CDT_OCCT_PREFIX="$(brew --prefix opencascade)"
          cargo test --workspace --locked

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        # cdt-render is excluded until its wgpu-device tests are verified
        # against the runner's WARP adapter.
        # One test at a time, so a hang is named by the last line of the log
        # instead of hiding among the tests in flight on other threads.
        run: cargo test --workspace --locked --exclude cdt-render --no-fail-fast -- --test-threads=1
